name: Publish E3 development update

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/workflows/ci.yml
      - .github/workflows/fast-ci.yml
      - AGENTS.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - CURRENT_STATE.md
      - PROJECT_STATUS.md
      - README.md
      - ROADMAP.md
      - SAFETY.md
      - docs/**
      - requirements-dev.txt
      - tests/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e3-development-update
  cancel-in-progress: true

env:
  E3_UPDATE_CHANNEL: development
  E3_RELEASE_TAG: e3-development

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install E3 desktop dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[desktop]"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows update installer
        shell: pwsh
        run: |
          .\packaging\build_windows.ps1 `
            -Revision "${{ github.sha }}" `
            -Channel "$env:E3_UPDATE_CHANNEL" `
            -Repository "${{ github.repository }}" `
            -ReleaseTag "$env:E3_RELEASE_TAG" `
            -OutputBaseFilename "E3-Setup"
      - uses: actions/upload-artifact@v7
        with:
          name: e3-windows-update
          path: installer-dist/E3-Setup.exe
          if-no-files-found: error

  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install E3 desktop dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[desktop]"
      - name: Build Linux AppImage
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash ./packaging/build_linux_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: e3-linux-update
          path: E3-x86_64.AppImage
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package metadata
        run: python -m pip install -e .
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Prepare immutable update assets and manifest
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          publication_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mv release/E3-Setup.exe "release/E3-Setup-${short_sha}.exe"
          mv release/E3-x86_64.AppImage "release/E3-${short_sha}-x86_64.AppImage"
          python packaging/make_update_manifest.py \
            --output "release/update-manifest-${short_sha}-${publication_id}.json" \
            --revision "${{ github.sha }}" \
            --channel "$E3_UPDATE_CHANNEL" \
            --repository "${{ github.repository }}" \
            --release-tag "$E3_RELEASE_TAG" \
            --windows "release/E3-Setup-${short_sha}.exe" \
            --linux "release/E3-${short_sha}-x86_64.AppImage"
      - name: Publish verified development update
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          publication_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python packaging/publish_development_update.py publish \
            --repository "${{ github.repository }}" \
            --release-tag "$E3_RELEASE_TAG" \
            --revision "${{ github.sha }}" \
            --channel "$E3_UPDATE_CHANNEL" \
            --windows "release/E3-Setup-${short_sha}.exe" \
            --linux "release/E3-${short_sha}-x86_64.AppImage" \
            --manifest "release/update-manifest-${short_sha}-${publication_id}.json" \
            --title "E3 Development ${{ github.sha }}" \
            --notes "Automated build from ${{ github.ref_name }} at ${{ github.sha }}." \
            --recovery-state release/manifest-switch-recovery.json
      - name: Recover interrupted manifest switch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/publish_development_update.py recover \
            --repository "${{ github.repository }}" \
            --release-tag "$E3_RELEASE_TAG" \
            --recovery-state release/manifest-switch-recovery.json
