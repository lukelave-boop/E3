name: Compatibility CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            desktop: false
          - python-version: "3.12"
            desktop: true

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Upgrade pip
        run: python tools/ci_timed.py "Upgrade pip" -- python -m pip install --upgrade pip
      - name: Install base and test dependencies
        run: python tools/ci_timed.py "Install base and test dependencies" -- python -m pip install -e . -r requirements-dev.txt

      - if: matrix.desktop
        name: Install desktop dependencies
        run: python tools/ci_timed.py "Install desktop dependencies" -- python -m pip install -e ".[desktop]"

      - name: Validate dependencies
        run: python tools/ci_timed.py "Dependency validation" -- python -m pip check
      - name: Compile Python sources
        run: python tools/ci_timed.py "compileall" -- python -m compileall -q laser_aligner
      - name: Run full compatibility tests
        run: python tools/ci_timed.py "Full pytest (Windows, Python ${{ matrix.python-version }})" -- python -m pytest -q -n 4

  lint:
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Upgrade pip
        run: python tools/ci_timed.py "Upgrade pip (lint)" -- python -m pip install --upgrade pip
      - name: Install lint dependencies
        run: python tools/ci_timed.py "Install lint dependencies" -- python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        run: python tools/ci_timed.py "Ruff" -- python -m ruff check .

  posix-controller-session:
    name: POSIX serial and controller-session recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python tools/ci_timed.py "Upgrade pip (POSIX controller)" -- python -m pip install --upgrade pip
      - name: Install core and test dependencies
        run: python tools/ci_timed.py "Install POSIX controller dependencies" -- python -m pip install -e . -r requirements-dev.txt
      - name: Run POSIX transport and recovery tests
        run: >-
          python tools/ci_timed.py "POSIX serial/session pytest" --
          python -m pytest -q
          tests/test_serial_posix.py
          tests/test_controller_session.py
          tests/test_machine_transcripts.py
          tests/test_secondary_controller.py
          tests/test_secondary_air_assist_integration.py
          tests/test_pi_job_protocol.py
          tests/test_pi_machine_server.py
          tests/test_pi_owned_job_e2e.py
          tests/test_remote_machine_service.py
          tests/test_remote_node.py
