name: CI

on:
  push:
    branches:
      - main
      - desktop-v1
      - "cleanup/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            desktop: false
          - os: ubuntu-latest
            python-version: "3.11"
            desktop: false
          - os: ubuntu-latest
            python-version: "3.12"
            desktop: true
          - os: windows-latest
            python-version: "3.10"
            desktop: false
          - os: windows-latest
            python-version: "3.12"
            desktop: true
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt
      - if: runner.os == 'Linux' && matrix.desktop
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . -r requirements-dev.txt
      - if: matrix.desktop
        run: python -m pip install -e ".[desktop]"
      - run: python -m pip check
      - run: python -m compileall -q laser_aligner
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
