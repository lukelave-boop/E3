name: DEV TEST launcher

on:
  push:
    branches: [codex/dev-test-known-folders]
  pull_request:
    paths:
      - laser_aligner/dev_test_launcher.py
      - laser_aligner/windows_user_folders.py
      - tests/test_dev_test_launcher.py
      - tests/test_windows_user_folders.py
      - .github/workflows/dev-test-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install launcher build dependencies
        run: python -m pip install pyinstaller pytest
      - name: Check native folders and launcher isolation
        run: python -m pytest -q tests/test_dev_test_launcher.py tests/test_windows_user_folders.py
      - name: Build launcher
        shell: pwsh
        run: .\packaging\build_dev_test_launcher.ps1 -Python (Get-Command python).Source -EphemeralCI
      - uses: actions/upload-artifact@v4
        with:
          name: dev-test-launcher-${{ github.sha }}
          path: launcher-dist/E3 DEV TEST.exe
          if-no-files-found: error
          retention-days: 7
